labels:
  platform: linux/amd64
when:
- event: push
  branch:
  - master
- event: pull_request
clone:
- name: git
  image: docker.io/woodpeckerci/plugin-git:2.12.1
  settings:
    partial: false
    depth: 1
steps:
- name: lint
  image: localhost/woodpecker/toolbox:personal-3
  commands:
  - timeout --kill-after=30s 10m bash .woodpecker/scripts/ci-lint.sh
